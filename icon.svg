<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">

  <!-- Background -->
  <rect width="512" height="512" fill="#060606"/>

  <!-- Wood frame -->
  <rect x="28" y="28" width="456" height="456" fill="#3A2208"/>
  <rect x="28" y="28" width="456" height="4"   fill="#7A5228"/>
  <rect x="28" y="28" width="4"   height="456" fill="#7A5228"/>
  <rect x="28" y="480" width="456" height="4"  fill="#120800"/>
  <rect x="480" y="28" width="4"  height="456" fill="#120800"/>
  <rect x="32" y="32" width="448" height="448" fill="#4A2C10"/>

  <!-- Inner dark reveal -->
  <rect x="68" y="68" width="376" height="376" fill="#030202"/>

  <!--
    Concentric squares — dusk palette, nested fills (no gaps)
    8×8 grid of 46px cells starting at (72,72)
    Drawn outer→inner so each layer covers the previous.
  -->
  <rect x="72"  y="72"  width="368" height="368" fill="#07000F"/>
  <rect x="118" y="118" width="276" height="276" fill="#480080"/>
  <rect x="164" y="164" width="184" height="184" fill="#A855C0"/>
  <rect x="210" y="210" width="92"  height="92"  fill="#F5C8A0"/>

  <!-- Inner frame shadow -->
  <rect x="68" y="68" width="376" height="3" fill="#000000" opacity="0.7"/>
  <rect x="68" y="68" width="3" height="376" fill="#000000" opacity="0.7"/>

</svg>
